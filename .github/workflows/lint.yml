name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check init.lua lua/

  selene:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install selene
        run: |
          curl -sL "https://github.com/Kampfkarren/selene/releases/download/0.30.1/selene-0.30.1-linux.zip" -o selene.zip
          unzip -q selene.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/selene"
          rm selene.zip
      - name: Run selene
        run: |
          "$HOME/.local/bin/selene" --display-style quiet ./init.lua ./lua/
